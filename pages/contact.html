
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>[ADD CONTACT PAGE TITLE] | CZ</title>

    <meta
        name="description"
        content="[ADD CONTACT PAGE DESCRIPTION]"
    >

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/main-responsive.css">

</head>

<body>

    <div id="site-header"></div>

    <main>

        <section class="section page-hero">

            <div class="container">

                <div class="section-header reveal">

                    <div id="contact-back"></div>

                    <span class="section-label">
                        CONTACT
                    </span>

                    <h1>
                        [ADD CONTACT PAGE TITLE]
                    </h1>

                    <p>
                        [ADD CONTACT PAGE INTRODUCTION]
                    </p>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="contact-layout">

                    <div
                        class="contact-information reveal"
                        id="contact-information"
                    ></div>


                    <form
                        class="card card-glass contact-form reveal"
                        id="contact-form"
                    >

                        <h2>
                            [ADD FORM TITLE]
                        </h2>

                        <p>
                            [ADD FORM DESCRIPTION]
                        </p>

                        <div class="form-group">

                            <label class="form-label">
                                [ADD NAME LABEL]
                            </label>

                            <input
                                class="form-input"
                                type="text"
                                name="name"
                                placeholder="[ADD NAME PLACEHOLDER]"
                                required
                            >

                            <small
                                class="form-error"
                                data-form-error="name"
                            ></small>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                [ADD EMAIL LABEL]
                            </label>

                            <input
                                class="form-input"
                                type="email"
                                name="email"
                                placeholder="[ADD EMAIL PLACEHOLDER]"
                                required
                            >

                            <small
                                class="form-error"
                                data-form-error="email"
                            ></small>

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                [ADD PHONE LABEL]
                            </label>

                            <input
                                class="form-input"
                                type="tel"
                                name="phone"
                                placeholder="[ADD PHONE PLACEHOLDER]"
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                [ADD MESSAGE LABEL]
                            </label>

                            <textarea
                                class="form-textarea"
                                name="message"
                                placeholder="[ADD MESSAGE PLACEHOLDER]"
                                required
                            ></textarea>

                            <small
                                class="form-error"
                                data-form-error="message"
                            ></small>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            [ADD SEND BUTTON TEXT]
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <div id="site-footer"></div>

    <script
        type="module"
        src="/js/main/contact.js"
    ></script>

</body>
</html>
