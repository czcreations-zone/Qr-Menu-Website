<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Restaurant Account | CZ Menu</title>

    <meta
        name="description"
        content="[RESTAURANT SIGNUP DESCRIPTION]"
    >

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin-responsive.css"
    >

</head>


<body class="admin-site">

    <main class="auth-page">

        <div class="auth-background">

            <div class="auth-orb auth-orb-one"></div>

            <div class="auth-orb auth-orb-two"></div>

        </div>


        <div class="auth-container">

            <a
                href="/index.html"
                class="auth-brand"
            >

                <img
                    src="/assets/logo/cz-logo.svg"
                    alt="CZ"
                >

            </a>


            <section
                class="
                    auth-card
                    glass
                    reveal
                "
            >

                <div class="auth-header">

                    <span class="section-label">
                        [ACCOUNT CREATION LABEL]
                    </span>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        [SIGNUP DESCRIPTION]
                    </p>

                </div>


                <form
                    id="admin-signup-form"
                    class="auth-form"
                    novalidate
                >

                    <div class="form-field">

                        <label for="signup-name">
                            Your Name
                        </label>

                        <input
                            id="signup-name"
                            name="name"
                            type="text"
                            autocomplete="name"
                            placeholder="[OWNER NAME PLACEHOLDER]"
                            required
                        >

                        <small
                            class="form-error"
                            data-error-for="name"
                        ></small>

                    </div>


                    <div class="form-field">

                        <label for="signup-email">
                            Email
                        </label>

                        <input
                            id="signup-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="[EMAIL PLACEHOLDER]"
                            required
                        >

                        <small
                            class="form-error"
                            data-error-for="email"
                        ></small>

                    </div>


                    <div class="form-field">

                        <label for="signup-password">
                            Password
                        </label>

                        <div class="password-field">

                            <input
                                id="signup-password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                placeholder="[PASSWORD PLACEHOLDER]"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="form-help"
                        >
                            [PASSWORD REQUIREMENTS]
                        </small>

                        <small
                            class="form-error"
                            data-error-for="password"
                        ></small>

                    </div>


                    <div class="form-field">

                        <label for="signup-confirm-password">
                            Confirm Password
                        </label>

                        <div class="password-field">

                            <input
                                id="signup-confirm-password"
                                name="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                placeholder="[CONFIRM PASSWORD PLACEHOLDER]"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="form-error"
                            data-error-for="confirmPassword"
                        ></small>

                    </div>


                    <div
                        class="auth-notice glass"
                    >

                        <strong>
                            [APPROVAL NOTICE TITLE]
                        </strong>

                        <p>
                            [APPROVAL NOTICE DESCRIPTION]
                        </p>

                    </div>


                    <div
                        id="admin-signup-message"
                        class="auth-message"
                        hidden
                    ></div>


                    <button
                        type="submit"
                        class="
                            btn
                            btn-primary
                            btn-full
                        "
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-footer">

                    <p>
                        Already have an account?
                    </p>

                    <a
                        href="/pages/restaurant-admin/login.html"
                        class="btn btn-secondary btn-full"
                    >
                        Login
                    </a>

                </div>


                <a
                    href="/index.html"
                    class="auth-back"
                >
                    ← Back to CZ
                </a>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="/js/admin/auth.js"
    ></script>

</body>

</html>
