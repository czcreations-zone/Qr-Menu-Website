<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | CZ Menu</title>

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin-responsive.css"
    >

</head>


<body class="admin-site">

    <main class="auth-page">

        <div class="auth-background">

            <div class="auth-orb auth-orb-one"></div>

            <div class="auth-orb auth-orb-two"></div>

        </div>


        <div class="auth-container">

            <a
                href="/index.html"
                class="auth-brand"
            >

                <img
                    src="/assets/logo/cz-logo.svg"
                    alt="CZ"
                >

            </a>


            <section
                class="
                    auth-card
                    glass
                    reveal
                "
            >

                <div class="auth-header">

                    <span class="section-label">
                        [PASSWORD RECOVERY LABEL]
                    </span>

                    <h1>
                        Forgot Password?
                    </h1>

                    <p>
                        [PASSWORD RECOVERY DESCRIPTION]
                    </p>

                </div>


                <form
                    id="forgot-password-form"
                    class="auth-form"
                    novalidate
                >

                    <div class="form-field">

                        <label for="forgot-email">
                            Email
                        </label>

                        <input
                            id="forgot-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="[EMAIL PLACEHOLDER]"
                            required
                        >

                        <small
                            class="form-error"
                            data-error-for="email"
                        ></small>

                    </div>


                    <div
                        id="forgot-password-message"
                        class="auth-message"
                        hidden
                    ></div>


                    <button
                        type="submit"
                        class="
                            btn
                            btn-primary
                            btn-full
                        "
                    >
                        Send Reset Link
                    </button>

                </form>


                <div class="auth-footer">

                    <a
                        href="/pages/restaurant-admin/login.html"
                        class="btn btn-secondary btn-full"
                    >
                        ← Back to Login
                    </a>

                </div>


                <a
                    href="/index.html"
                    class="auth-back"
                >
                    ← Back to CZ
                </a>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="/js/admin/auth.js"
    ></script>

</body>

</html>
