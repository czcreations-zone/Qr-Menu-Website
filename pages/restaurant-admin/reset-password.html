<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set New Password | CZ Menu</title>

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/admin-responsive.css"
    >

</head>


<body class="admin-site">

    <main class="auth-page">

        <div class="auth-background">

            <div class="auth-orb auth-orb-one"></div>

            <div class="auth-orb auth-orb-two"></div>

        </div>


        <div class="auth-container">

            <a
                href="/index.html"
                class="auth-brand"
            >

                <img
                    src="/assets/logo/cz-logo.svg"
                    alt="CZ"
                >

            </a>


            <section
                class="
                    auth-card
                    glass
                    reveal
                "
            >

                <div class="auth-header">

                    <span class="section-label">
                        [PASSWORD RESET LABEL]
                    </span>

                    <h1>
                        Set New Password
                    </h1>

                    <p>
                        [PASSWORD RESET DESCRIPTION]
                    </p>

                </div>


                <form
                    id="reset-password-form"
                    class="auth-form"
                    novalidate
                >

                    <div class="form-field">

                        <label for="new-password">
                            New Password
                        </label>

                        <div class="password-field">

                            <input
                                id="new-password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                placeholder="[NEW PASSWORD PLACEHOLDER]"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="form-error"
                            data-error-for="password"
                        ></small>

                    </div>


                    <div class="form-field">

                        <label for="new-password-confirm">
                            Confirm New Password
                        </label>

                        <div class="password-field">

                            <input
                                id="new-password-confirm"
                                name="confirmPassword"
                                type="password"
                                autocomplete="new-password"
                                placeholder="[CONFIRM PASSWORD PLACEHOLDER]"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="form-error"
                            data-error-for="confirmPassword"
                        ></small>

                    </div>


                    <div
                        id="reset-password-message"
                        class="auth-message"
                        hidden
                    ></div>


                    <button
                        type="submit"
                        class="
                            btn
                            btn-primary
                            btn-full
                        "
                    >
                        Update Password
                    </button>

                </form>


                <a
                    href="/pages/restaurant-admin/login.html"
                    class="auth-back"
                >
                    ← Back to Login
                </a>

            </section>

        </div>

    </main>


    <script
        type="module"
        src="/js/admin/auth.js"
    ></script>

</body>

</html>
