
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Menu | [RESTAURANT NAME]</title>

    <meta
        name="description"
        content="[RESTAURANT MENU DESCRIPTION]"
    >

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/restaurant.css">
    <link rel="stylesheet" href="/css/restaurant-responsive.css">
    

</head>

<body class="restaurant-site">

    <div id="restaurant-header"></div>

    <main>

        <!-- RESTAURANT HERO -->
        <section
            class="restaurant-menu-hero"
            id="restaurant-menu-hero"
        >

            <div class="restaurant-menu-hero__background">
                <img
                    id="restaurant-cover-image"
                    src="/assets/images/restaurant/cover-placeholder.svg"
                    alt="[RESTAURANT NAME]"
                >
            </div>

            <div class="restaurant-menu-hero__overlay"></div>

            <div class="container restaurant-menu-hero__content">

                <div
                    class="restaurant-brand reveal"
                >

                    <div class="restaurant-brand__logo glass">
                        <img
                            id="restaurant-logo"
                            src="/assets/logo/cz-logo-mark.svg"
                            alt="[RESTAURANT NAME]"
                        >
                    </div>

                    <span
                        class="restaurant-status"
                        id="restaurant-status"
                    >
                        <span></span>
                        [STATUS]
                    </span>

                </div>

                <span
                    class="section-label"
                    id="restaurant-category"
                >
                    [RESTAURANT CATEGORY]
                </span>

                <h1 id="restaurant-name">
                    [RESTAURANT NAME]
                </h1>

                <p id="restaurant-tagline">
                    [RESTAURANT TAGLINE]
                </p>

                <div
                    class="restaurant-meta"
                    id="restaurant-meta"
                ></div>

            </div>

        </section>


        <!-- MENU -->
        <section class="section restaurant-menu-section">

            <div class="container">

                <div class="restaurant-section-header">

                    <div>

                        <span class="section-label">
                            MENU
                        </span>

                        <h2>
                            [MENU TITLE]
                        </h2>

                    </div>

                    <button
                        type="button"
                        class="restaurant-menu-toggle"
                        id="restaurant-search-toggle"
                        aria-label="Open menu search"
                    >
                        Search
                    </button>

                </div>


                <!-- SEARCH -->
                <div
                    class="restaurant-search glass"
                    id="restaurant-search"
                >

                    <div class="restaurant-search__input">

                        <span aria-hidden="true">
                            ⌕
                        </span>

                        <input
                            id="menu-search"
                            type="search"
                            placeholder="[SEARCH MENU PLACEHOLDER]"
                            autocomplete="off"
                        >

                        <button
                            type="button"
                            id="clear-menu-search"
                            aria-label="Clear search"
                        >
                            ×
                        </button>

                    </div>


                    <div
                        class="restaurant-filter"
                        role="group"
                        aria-label="Menu filters"
                    >

                        <button
                            type="button"
                            class="filter-button is-active"
                            data-filter="all"
                        >
                            All
                        </button>

                        <button
                            type="button"
                            class="filter-button"
                            data-filter="veg"
                        >
                            Veg
                        </button>

                        <button
                            type="button"
                            class="filter-button"
                            data-filter="non-veg"
                        >
                            Non-Veg
                        </button>

                    </div>

                </div>


                <!-- MENU CONTENT -->
                <div
                    id="restaurant-menu"
                    class="restaurant-menu"
                ></div>


                <div
                    id="menu-empty"
                    class="menu-empty"
                    hidden
                >

                    <div class="menu-empty__icon">
                        ⌕
                    </div>

                    <h3>
                        [NO ITEMS TITLE]
                    </h3>

                    <p>
                        [NO ITEMS DESCRIPTION]
                    </p>

                </div>

            </div>

        </section>


        <!-- POWERED BY -->
        <section class="restaurant-powered">

            <div class="container">

                <div class="restaurant-powered__inner">

                    <span>
                        [POWERED BY TEXT]
                    </span>

                    <img
                        src="/assets/logo/cz-logo-mark.svg"
                        alt="CZ"
                    >

                    <strong>
                        CZ
                    </strong>

                </div>

            </div>

        </section>

    </main>


    <div id="restaurant-footer"></div>


    <script
        type="module"
        src="/js/restaurant/restaurant-app.js"
    ></script>
    <script
    type="module"
    src="/js/restaurant/menu.js"
    ></script></script>

</body>
</html>
