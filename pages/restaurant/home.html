<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home | [RESTAURANT NAME]</title>

    <meta
        name="description"
        content="[RESTAURANT HOME DESCRIPTION]"
    >

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/restaurant.css">
    <link rel="stylesheet" href="/css/restaurant-responsive.css">

</head>

<body class="restaurant-site">

    <div id="restaurant-header"></div>

    <main>

        <section class="restaurant-page-hero">

            <div class="restaurant-page-hero__background">

                <img
                    id="restaurant-home-image"
                    src="/assets/images/restaurant/home-placeholder.svg"
                    alt="[RESTAURANT NAME]"
                >

            </div>

            <div class="restaurant-page-hero__overlay"></div>

            <div class="container restaurant-page-hero__content">

                <span class="section-label">
                    [RESTAURANT CATEGORY]
                </span>

                <h1 id="home-title">
                    [RESTAURANT HOME TITLE]
                </h1>

                <p id="home-description">
                    [RESTAURANT HOME DESCRIPTION]
                </p>

                <a
                    href="/pages/restaurant/index.html"
                    class="btn btn-primary"
                >
                    [VIEW MENU BUTTON]
                </a>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="restaurant-introduction">

                    <span class="section-label">
                        [ABOUT RESTAURANT LABEL]
                    </span>

                    <h2 id="restaurant-about-title">
                        [ABOUT RESTAURANT TITLE]
                    </h2>

                    <p id="restaurant-about-description">
                        [ABOUT RESTAURANT DESCRIPTION]
                    </p>

                </div>

            </div>

        </section>


        <section class="section layered-section">

            <div class="container">

                <div class="restaurant-highlights">

                    <div
                        class="restaurant-highlight glass"
                        id="restaurant-highlight-one"
                    ></div>

                    <div
                        class="restaurant-highlight glass"
                        id="restaurant-highlight-two"
                    ></div>

                    <div
                        class="restaurant-highlight glass"
                        id="restaurant-highlight-three"
                    ></div>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="restaurant-cta glass">

                    <div>

                        <span class="section-label">
                            [CTA LABEL]
                        </span>

                        <h2>
                            [CTA TITLE]
                        </h2>

                        <p>
                            [CTA DESCRIPTION]
                        </p>

                    </div>

                    <a
                        href="/pages/restaurant/index.html"
                        class="btn btn-primary"
                    >
                        [CTA BUTTON]
                    </a>

                </div>

            </div>

        </section>

    </main>

    <div id="restaurant-footer"></div>

    <script
        type="module"
        src="/js/restaurant/restaurant-home.js"
    ></script>
    <script
    type="module"
    src="/js/restaurant/home.js"
    ></script>

</body>
</html>
