
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admins | CZ Menu</title>

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin-responsive.css"
    >

</head>


<body class="super-admin-site">


<div class="super-admin-app">


    <aside
        class="super-admin-sidebar"
        id="super-admin-sidebar"
    >

        <div class="super-admin-sidebar__top">

            <a
                href="/pages/super-admin/dashboard.html"
                class="super-admin-brand"
            >

                <img
                    src="/assets/logo/cz-logo-mark.svg"
                    alt="CZ"
                >

                <span>CZ Menu</span>

            </a>


            <button
                type="button"
                id="super-sidebar-close"
                class="super-sidebar-close"
                aria-label="Close navigation"
            >
                ×
            </button>

        </div>


        <div class="super-admin-role">

            <span>
                [PLATFORM ADMIN LABEL]
            </span>

            <strong>
                Super Admin
            </strong>

        </div>


        <nav class="super-admin-nav">

            <a
                href="/pages/super-admin/dashboard.html"
                class="super-admin-nav__item"
            >
                <span>◈</span>
                <span>Dashboard</span>
            </a>


            <a
                href="/pages/super-admin/restaurants.html"
                class="super-admin-nav__item"
            >
                <span>◎</span>
                <span>Restaurants</span>
            </a>


            <a
                href="/pages/super-admin/admins.html"
                class="
                    super-admin-nav__item
                    is-active
                "
            >
                <span>○</span>
                <span>Admins</span>
            </a>


            <a
                href="/pages/super-admin/activity.html"
                class="super-admin-nav__item"
            >
                <span>◷</span>
                <span>Activity</span>
            </a>


            <a
                href="/pages/super-admin/settings.html"
                class="super-admin-nav__item"
            >
                <span>⚙</span>
                <span>Settings</span>
            </a>

        </nav>


        <div class="super-admin-sidebar__bottom">

            <a
                href="/index.html"
                class="super-admin-site-link"
                target="_blank"
                rel="noopener noreferrer"
            >
                ↗ View CZ Website
            </a>


            <button
                type="button"
                id="super-admin-logout"
                class="super-admin-logout"
            >
                ⇥ Logout
            </button>

        </div>

    </aside>


    <div
        id="super-admin-overlay"
        class="super-admin-overlay"
        hidden
    ></div>


    <div class="super-admin-main">


        <header class="super-admin-topbar">

            <div class="super-admin-topbar__left">

                <button
                    type="button"
                    id="super-sidebar-open"
                    class="super-sidebar-open"
                    aria-label="Open navigation"
                >
                    ☰
                </button>


                <div>

                    <span>
                        [ADMIN MANAGEMENT LABEL]
                    </span>

                    <h1>
                        Admins
                    </h1>

                </div>

            </div>

        </header>


        <main class="super-admin-content">


            <section
                class="
                    super-admin-welcome
                    glass
                    reveal
                "
            >

                <div>

                    <span class="section-label">
                        [ADMIN MANAGEMENT LABEL]
                    </span>

                    <h2>
                        Restaurant Administrators
                    </h2>

                    <p>
                        [ADMINS PAGE DESCRIPTION]
                    </p>

                </div>

            </section>


            <section class="super-admin-section">


                <div class="super-admin-toolbar">

                    <div class="form-field">

                        <label for="admin-search">
                            Search
                        </label>

                        <input
                            id="admin-search"
                            type="search"
                            placeholder="[SEARCH ADMINS]"
                        >

                    </div>


                    <select
                        id="admin-role"
                        class="admin-select"
                    >

                        <option value="all">
                            All Roles
                        </option>

                        <option value="restaurant_admin">
                            Restaurant Admin
                        </option>

                        <option value="super_admin">
                            Super Admin
                        </option>

                    </select>


                    <select
                        id="admin-status"
                        class="admin-select"
                    >

                        <option value="all">
                            All Status
                        </option>

                        <option value="active">
                            Active
                        </option>

                        <option value="inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <div
                    id="admin-list"
                    class="super-admin-grid"
                >
                    <!-- Generated -->
                </div>


                <div
                    id="admin-empty"
                    class="super-empty-state glass"
                    hidden
                >

                    <strong>
                        [NO ADMINS TITLE]
                    </strong>

                    <p>
                        [NO ADMINS DESCRIPTION]
                    </p>

                </div>


            </section>


        </main>


        <button
            type="button"
            id="super-admin-back"
            class="super-admin-back"
        >
            ← Back
        </button>


    </div>

</div>


<script
    type="module"
    src="/js/super-admin/admins.js"
></script>

</body>

</html>
