
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Details | CZ Menu</title>

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin-responsive.css"
    >

</head>


<body class="super-admin-site">


<div class="super-admin-app">


    <aside
        class="super-admin-sidebar"
        id="super-admin-sidebar"
    >

        <div class="super-admin-sidebar__top">

            <a
                href="/pages/super-admin/dashboard.html"
                class="super-admin-brand"
            >

                <img
                    src="/assets/logo/cz-logo-mark.svg"
                    alt="CZ"
                >

                <span>CZ Menu</span>

            </a>


            <button
                type="button"
                id="super-sidebar-close"
                class="super-sidebar-close"
            >
                ×
            </button>

        </div>


        <div class="super-admin-role">

            <span>
                [PLATFORM ADMIN LABEL]
            </span>

            <strong>
                Super Admin
            </strong>

        </div>


        <nav class="super-admin-nav">

            <a
                href="/pages/super-admin/dashboard.html"
                class="super-admin-nav__item"
            >
                <span>◈</span>
                <span>Dashboard</span>
            </a>


            <a
                href="/pages/super-admin/restaurants.html"
                class="super-admin-nav__item is-active"
            >
                <span>◎</span>
                <span>Restaurants</span>
            </a>


            <a
                href="/pages/super-admin/admins.html"
                class="super-admin-nav__item"
            >
                <span>○</span>
                <span>Admins</span>
            </a>


            <a
                href="/pages/super-admin/activity.html"
                class="super-admin-nav__item"
            >
                <span>◷</span>
                <span>Activity</span>
            </a>


            <a
                href="/pages/super-admin/settings.html"
                class="super-admin-nav__item"
            >
                <span>⚙</span>
                <span>Settings</span>
            </a>

        </nav>


        <div class="super-admin-sidebar__bottom">

            <a
                href="/index.html"
                class="super-admin-site-link"
                target="_blank"
            >
                ↗ View CZ Website
            </a>


            <button
                type="button"
                id="super-admin-logout"
                class="super-admin-logout"
            >
                ⇥ Logout
            </button>

        </div>

    </aside>


    <div
        id="super-admin-overlay"
        class="super-admin-overlay"
        hidden
    ></div>


    <div class="super-admin-main">


        <header class="super-admin-topbar">

            <div class="super-admin-topbar__left">

                <button
                    type="button"
                    id="super-sidebar-open"
                    class="super-sidebar-open"
                >
                    ☰
                </button>


                <div>

                    <span>
                        [RESTAURANT DETAILS LABEL]
                    </span>

                    <h1 id="page-title">
                        Restaurant
                    </h1>

                </div>

            </div>

        </header>


        <main class="super-admin-content">


            <section
                id="restaurant-header"
                class="
                    super-admin-welcome
                    glass
                    reveal
                "
            >

                <div>

                    <span
                        class="section-label"
                        id="restaurant-slug"
                    >
                        [RESTAURANT SLUG]
                    </span>

                    <h2 id="restaurant-name">
                        [RESTAURANT NAME]
                    </h2>

                    <p id="restaurant-description">
                        [RESTAURANT DESCRIPTION]
                    </p>

                </div>


                <span
                    id="restaurant-status"
                    class="super-status"
                >
                    [STATUS]
                </span>

            </section>


            <section class="super-admin-section">


                <div class="super-admin-section-header">

                    <div>

                        <span class="section-label">
                            [RESTAURANT INFORMATION LABEL]
                        </span>

                        <h2>
                            Restaurant Information
                        </h2>

                    </div>

                </div>


                <form
                    id="restaurant-form"
                    class="admin-form glass"
                >


                    <div class="admin-form-grid">


                        <div class="form-field">

                            <label for="restaurant-name-input">
                                Name
                            </label>

                            <input
                                id="restaurant-name-input"
                                type="text"
                                placeholder="[RESTAURANT NAME]"
                            >

                        </div>


                        <div class="form-field">

                            <label for="restaurant-slug-input">
                                Slug
                            </label>

                            <input
                                id="restaurant-slug-input"
                                type="text"
                                placeholder="[RESTAURANT SLUG]"
                            >

                        </div>


                    </div>


                    <div class="form-field">

                        <label for="restaurant-description-input">
                            Description
                        </label>

                        <textarea
                            id="restaurant-description-input"
                            rows="5"
                            placeholder="[RESTAURANT DESCRIPTION]"
                        ></textarea>

                    </div>


                    <label class="admin-option-card">

                        <div>

                            <strong>
                                Published
                            </strong>

                            <span>
                                [PUBLISHED STATUS DESCRIPTION]
                            </span>

                        </div>

                        <input
                            id="restaurant-published"
                            type="checkbox"
                        >

                    </label>


                    <div class="admin-form-actions">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>


                        <button
                            type="button"
                            id="delete-restaurant"
                            class="
                                btn
                                btn-danger
                            "
                        >
                            Delete Restaurant
                        </button>

                    </div>


                </form>


            </section>


        </main>


        <button
            type="button"
            id="super-admin-back"
            class="super-admin-back"
        >
            ← Back
        </button>


    </div>

</div>


<script
    type="module"
    src="/js/super-admin/restaurant-details.js"
></script>

</body>

</html>
