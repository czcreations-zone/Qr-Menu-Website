
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Super Admin Login | CZ Menu</title>

    <meta
        name="description"
        content="[SUPER ADMIN LOGIN DESCRIPTION]"
    >

    <link
        rel="icon"
        href="/assets/logo/cz-logo-mark.svg"
    >

    <link
        rel="stylesheet"
        href="/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/components.css"
    >

    <link
        rel="stylesheet"
        href="/css/animations.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin.css"
    >

    <link
        rel="stylesheet"
        href="/css/super-admin-responsive.css"
    >

</head>


<body class="super-admin-site">


<main class="super-auth-page">


    <div
        class="
            super-auth-background
            super-auth-background--one
        "
    ></div>


    <div
        class="
            super-auth-background
            super-auth-background--two
        "
    ></div>


    <section
        class="
            super-auth-card
            glass
            reveal
        "
    >


        <a
            href="/index.html"
            class="super-auth-brand"
        >

            <img
                src="/assets/logo/cz-logo-mark.svg"
                alt="CZ"
            >

            <span>
                CZ Menu
            </span>

        </a>


        <div class="super-auth-heading">

            <span class="section-label">
                [ADMIN ACCESS LABEL]
            </span>

            <h1>
                Super Admin
            </h1>

            <p>
                [SUPER ADMIN LOGIN DESCRIPTION]
            </p>

        </div>


        <form
            id="super-admin-login-form"
            class="super-auth-form"
        >


            <div class="form-field">

                <label for="super-admin-email">
                    Email
                </label>

                <input
                    id="super-admin-email"
                    type="email"
                    autocomplete="email"
                    placeholder="[SUPER ADMIN EMAIL]"
                    required
                >

            </div>


            <div class="form-field">

                <label for="super-admin-password">
                    Password
                </label>

                <input
                    id="super-admin-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="[SUPER ADMIN PASSWORD]"
                    required
                >

            </div>


            <div
                id="super-admin-login-message"
                class="auth-message"
                hidden
            ></div>


            <button
                type="submit"
                class="
                    btn
                    btn-primary
                    btn-full
                "
                id="super-admin-login-button"
            >
                Sign In
            </button>


        </form>


        <div class="super-auth-footer">

            <a
                href="/index.html"
            >
                ← Back to CZ Menu
            </a>

        </div>


    </section>


</main>


<script
    type="module"
    src="/js/super-admin/auth.js"
></script>

</body>

</html>
