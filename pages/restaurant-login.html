<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant Login | CZ Menu</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/animations.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-site">
<main style="min-height:100vh;display:grid;place-items:center;padding:24px">
<section class="admin-form glass" style="width:min(460px,100%)">
<a href="/index.html">← [BACK TO WEBSITE]</a>
<div style="margin:28px 0"><span class="section-label">[RESTAURANT ADMIN LABEL]</span><h1>[RESTAURANT LOGIN TITLE]</h1><p>[RESTAURANT LOGIN DESCRIPTION]</p></div>
<form id="restaurant-login-form">
<div class="form-field"><label for="email">[EMAIL LABEL]</label><input id="email" type="email" autocomplete="email" required placeholder="[EMAIL PLACEHOLDER]"></div>
<div class="form-field"><label for="password">[PASSWORD LABEL]</label><input id="password" type="password" autocomplete="current-password" required placeholder="[PASSWORD PLACEHOLDER]"></div>
<button class="btn btn-primary" type="submit">[LOGIN BUTTON]</button>
<div id="login-message" class="auth-message" hidden></div>
</form>
<p style="margin-top:18px"><a href="/pages/restaurant-admin/forgot-password.html">[FORGOT PASSWORD LABEL]</a></p>
</section>
</main>
<script type="module">
import { loginAdmin } from "/js/firebase/auth.js";
const form=document.getElementById("restaurant-login-form");
const message=document.getElementById("login-message");
form.addEventListener("submit",async event=>{event.preventDefault();message.hidden=true;try{await loginAdmin(document.getElementById("email").value.trim(),document.getElementById("password").value);window.location.href="/pages/restaurant-admin/dashboard.html";}catch(error){message.hidden=false;message.textContent=error?.message||"[LOGIN ERROR MESSAGE]";}});
</script>
</body></html>
